configuration: native
description: >-
  GraphSleepNet with a fixed scalp-distance graph instead of its learned one, the fixed-graph
  ablation of Jia et al. (IJCAI 2020, Fig. 4a), through sleep-graph-benchmark's native pipeline
  on our fold 0: everything as in graphsleepnet/native.yaml except the adjacency, which is the
  benchmark's own distance graph for the prepared channels (the graph native MSTGCN uses:
  Gaussian of 2-D head-coordinate distance, sigma 0.35, rows normalised), passed through
  upstream's adjacency_override.
model: graphsleepnet
arguments: []
quick_arguments: [--epochs, 1, --early-stopping-start-epoch, 1, --selection-smoothing-window, 1,
                  --num-workers, 0]
predict_batch: 256
