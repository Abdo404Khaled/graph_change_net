configuration: causal
description: >-
  Causal control: the native configuration (native.yaml) unchanged except that every
  5-epoch window ends at the scored epoch instead of being centred on it, so the
  2 later epochs the native model sees are replaced by 2 more earlier ones
  (baselines/sleepgraph/causal_launcher.py for training, native_predict.py --causal for
  prediction). Retrained from scratch; measures what the model loses without future epochs.
causal: true
model: mstgcn
arguments: []
quick_arguments: [--feature-epochs, 1, --feature-early-stopping-start-epoch, 1, --epochs, 1,
                  --early-stopping-start-epoch, 1, --selection-smoothing-window, 1,
                  --num-workers, 0]
predict_batch: 64
