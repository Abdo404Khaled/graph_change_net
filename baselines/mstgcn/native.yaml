configuration: native
description: >-
  MSTGCN (Jia et al., IEEE TNSRE 2021) as released, through sleep-graph-benchmark's native
  pipeline on our fold 0: upstream's ANPHY preparation (19 EEG + 2 EOG + 2 EMG channels,
  0.3-100 Hz, 100 Hz), its two-stage training (the official two-branch FeatureNet per epoch,
  then the graph network on 5-epoch windows of its features with a learned functional graph
  per epoch, the benchmark's static distance graph and a domain-adversarial head), upstream's
  model selection. Every scored test epoch is then predicted from the selected checkpoint
  with upstream's edge-padded windows.
model: mstgcn
arguments: []
quick_arguments: [--feature-epochs, 1, --feature-early-stopping-start-epoch, 1, --epochs, 1,
                  --early-stopping-start-epoch, 1, --selection-smoothing-window, 1,
                  --num-workers, 0]
predict_batch: 64
