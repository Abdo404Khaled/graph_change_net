name: native
mode: native
description: >-
  Causal control of the native configuration (native.yaml): the same released checkpoints,
  channels and preprocessing (cached nights are shared through name: native), but every scored
  epoch is predicted from the 35 epochs ending at it (17.5 min, the training sequence length)
  and only the last output is kept, instead of the whole night in one pass. The per-night
  robust scaling still uses whole-night statistics, as in native.yaml. No training.
causal_window_epochs: 35
causal_batch: 8
checkpoints:
  - upstream/models/anysleep-run1.pth
  - upstream/models/anysleep-run2.pth
  - upstream/models/anysleep-run3.pth
network:
  depth: 12
  complexity: 1.2923
  scale: 1.4142
  hidden_size: 40
  sleep_stage_frequency: 1
preprocessing:
  sampling_rate_hz: 128
  clip_iqr_multiple: 20
  epoch_seconds: 30
channels: [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2, F7, F8, T3, T4, T5, T6, FZ, CZ, PZ,
           F9, F10, T9, T10, P9, P10, AF7, AF3, F11, F5, F1, FT11, FT9, FT7, FC5, FC3, FC1,
           FCZ, C5, C1, TP11, TP9, TP7, CP3, CP1, P11, P5, P1, PO7, PO3, POZ, OZ, FPZ, AFZ,
           AF4, AF8, F2, F6, F12, FC2, FC4, FC6, FT8, FT10, FT12, C6, C2, CPZ, CP2, CP4,
           CP6, TP8, TP10, TP12, P2, P6, P12, PO4, PO8, EOG2, EOG1, CP5]
